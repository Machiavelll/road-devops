- name: Otestuj appku
  run: |
    docker run -d -p 8080:8080 --name test road-devops
    sleep 5
    
    # Wait for the service to be ready with retries
    for i in {1..10}; do
      if curl -f http://localhost:8080; then
        echo "Service is up!"
        break
      fi
      echo "Attempt $i: Service not ready, waiting..."
      sleep 2
    done
    
    docker stop test
