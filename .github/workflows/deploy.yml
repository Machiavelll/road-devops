name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: stahni kod
        uses: actions/checkout@v4

      - name: postav Docker image
        run: docker build -t road-devops .

      - name: otestuj appku
        run: |
          docker run -d --rm -p 8080:8080 --name test road-devops
          sleep 5
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080
          docker stop test
