name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: stahne kod
        uses: actions/checkout@v4

      - name: postav Docker image
        run: docker build -t devops-projekt .

      - name: Otestuj appku
        run: |
          docker run -d -p 8080:8080 --name test road-devops
          sleep 2
          curl http://localhost:8080
          docker stop test
